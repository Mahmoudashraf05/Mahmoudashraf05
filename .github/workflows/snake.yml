name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Mahmoudashraf05
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=black&color_dots=#000000,#111111,#222222,#333333,#444444
            dist/github-contribution-grid-snake-dark.svg?color_snake=black&color_dots=#000000,#111111,#222222,#333333,#444444

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
